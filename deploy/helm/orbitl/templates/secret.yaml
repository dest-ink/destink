apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orbitl.fullname" . }}
  labels:
    {{- include "orbitl.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
type: Opaque
data:
  DATABASE_URL: {{ include "orbitl.databaseUrl" . | b64enc | quote }}
  ANTHROPIC_API_KEY: {{ .Values.env.ANTHROPIC_API_KEY | b64enc | quote }}
  ENCRYPTION_KEY: {{ .Values.env.ENCRYPTION_KEY | b64enc | quote }}
  EXA_API_KEY: {{ .Values.env.EXA_API_KEY | b64enc | quote }}
  REDDIT_CLIENT_ID: {{ .Values.env.REDDIT_CLIENT_ID | b64enc | quote }}
  REDDIT_CLIENT_SECRET: {{ .Values.env.REDDIT_CLIENT_SECRET | b64enc | quote }}
  LINKEDIN_CLIENT_ID: {{ .Values.env.LINKEDIN_CLIENT_ID | b64enc | quote }}
  LINKEDIN_CLIENT_SECRET: {{ .Values.env.LINKEDIN_CLIENT_SECRET | b64enc | quote }}
  LINKEDIN_REDIRECT_URI: {{ .Values.env.LINKEDIN_REDIRECT_URI | b64enc | quote }}
  NEXT_PUBLIC_APP_URL: {{ .Values.env.NEXT_PUBLIC_APP_URL | b64enc | quote }}
  AUTH_SECRET: {{ .Values.env.AUTH_SECRET | b64enc | quote }}
