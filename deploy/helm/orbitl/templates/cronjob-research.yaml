{{- if .Values.cronJobs.research.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "orbitl.fullname" . }}-research
  labels:
    {{- include "orbitl.labels" . | nindent 4 }}
    app.kubernetes.io/component: research
spec:
  schedule: {{ .Values.cronJobs.research.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "orbitl.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: research
        spec:
          restartPolicy: OnFailure
          containers:
            - name: research
              image: "{{ .Values.jobs.image.repository }}:{{ .Values.jobs.image.tag }}"
              imagePullPolicy: IfNotPresent
              command: ["npx", "tsx", "src/jobs/research.ts"]
              envFrom:
                - secretRef:
                    name: {{ include "orbitl.fullname" . }}
              resources:
                {{- toYaml .Values.jobs.resources | nindent 16 }}
{{- end }}
