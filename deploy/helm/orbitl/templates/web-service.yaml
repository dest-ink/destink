apiVersion: v1
kind: Service
metadata:
  name: {{ include "orbitl.fullname" . }}-web
  labels:
    {{- include "orbitl.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: {{ .Values.web.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "orbitl.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
