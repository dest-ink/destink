services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orbitl
      POSTGRES_PASSWORD: orbitl
      POSTGRES_DB: orbitl
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbitl"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "3021:3021"
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql://orbitl:orbitl@db:5432/orbitl
      PORT: "3021"
    depends_on:
      db:
        condition: service_healthy

  daemon:
    build:
      context: .
      dockerfile: docker/Dockerfile.daemon
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql://orbitl:orbitl@db:5432/orbitl
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
