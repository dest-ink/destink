services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orbitl
      POSTGRES_PASSWORD: orbitl
      POSTGRES_DB: orbitl
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbitl"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.jobs
    command: npx drizzle-kit migrate
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://orbitl:orbitl@postgres:5432/orbitl
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "3021:3021"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://orbitl:orbitl@postgres:5432/orbitl
      PORT: "3021"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3021/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  daemon:
    build:
      context: .
      dockerfile: docker/Dockerfile.daemon
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://orbitl:orbitl@postgres:5432/orbitl
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
